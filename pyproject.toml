[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuxianggua-refgrain"
version = "0.1.0"
description = "把候选项映射到类别上，算出文档的引用粒度的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "yuxianggua" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yuxianggua.github.io"
Repository = "https://github.com/yuxianggua/refgrain"
Issues = "https://github.com/yuxianggua/refgrain/issues"

[project.scripts]
refgrain = "refgrain:main"

[tool.setuptools]
py-modules = ["refgrain"]
